name: Publish to NuGet

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

# 最小権限原則: NuGet 公開には GITHUB_TOKEN への書き込み権限は不要。
# actions/checkout が利用する contents:read のみ許可する。
permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AlphaFS.slnx

      - name: Build Release
        run: dotnet build AlphaFS.slnx -c Release --no-restore

      - name: Verify Version matches branch name
        # ブランチ release/x.y.z が push されたら、Directory.Build.props の <Version> が x.y.z と一致しているか照合。
        # 一致しない場合は CI を fail-fast させて NuGet への誤バージョン push を防ぐ。
        # workflow_dispatch (手動実行) では照合をスキップ。
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          $propsVersion = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $expectedVersion = '${{ github.ref_name }}' -replace '^release/', ''
          if ($propsVersion -ne $expectedVersion) {
            Write-Error "Directory.Build.props Version='$propsVersion' does not match branch 'release/$expectedVersion'. Update <Version> in Directory.Build.props before pushing."
            exit 1
          }
          Write-Host "Version OK: Directory.Build.props=$propsVersion matches branch release/$expectedVersion"
        shell: pwsh

      - name: Run unit tests
        # MSTest 4.x は Microsoft.Testing.Platform (MTP) v2 を使う。VSTest 専用の `--logger` は MTP では
        # 不正な引数となり、テストを 1 件も実行しないまま exit 5 で抜けてしまうため指定しない
        # (MTP は既定でコンソールへ結果を出力する)。MTP モードへの切り替えは repo 直下の global.json で行う。
        #
        # ALPHAFS_SKIP_NETWORK_TESTS: runner には SMB 管理共有が無いため、ネットワーク側の検証は
        # Assert.Inconclusive で skip する。ローカル側は先に実行されるのでリグレッションは検知できる。
        # 管理者権限が必要な検証も同様に skip されるため、失敗はすべて本物のリグレッションとして扱う。
        env:
          ALPHAFS_SKIP_NETWORK_TESTS: '1'
        run: dotnet test AlphaFS.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/AlphaFS/AlphaFS.csproj -c Release --no-build -o artifacts

      - name: Publish to NuGet
        run: |
          $apiKey = $env:NUGET_API_KEY
          .\publish.ps1
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
