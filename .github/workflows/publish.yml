name: Publish to NuGet

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

# 最小権限原則: checkout 用の contents:read と、NuGet.org の
# Trusted Publishing で短期資格情報を取得する id-token:write だけを許可する。
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        shell: pwsh
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $header = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CHECKOUT_TOKEN"))
          Write-Output "::add-mask::$header"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = "http.$env:GITHUB_SERVER_URL/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $header"
          try {
            git fetch --force --tags origin $env:CHECKOUT_REF
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git checkout --detach FETCH_HEAD
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            $env:GIT_CONFIG_COUNT = $null
            $env:GIT_CONFIG_KEY_0 = $null
            $env:GIT_CONFIG_VALUE_0 = $null
          }

      - name: Verify Version matches branch name
        # ブランチ release/x.y.z に対して、Directory.Build.props の <Version> が x.y.z と一致しているか照合。
        # 一致しない場合は CI を fail-fast させて NuGet への誤バージョン push を防ぐ。
        #
        # この照合は push / workflow_dispatch のどちらの経路でも必ず実行する。条件付き skip にすると、
        # skip されたステップは success 扱いのまま後続の Pack / Publish へ進んでしまい、
        # release ブランチ以外 (例: version を bump 済みの main) からの手動実行で
        # 未公開バージョンが nuget.org へ確定公開される。NuGet はバージョン番号を永久に予約し、
        # unlist はできても同一バージョンの再アップロードはできないため、この事故は不可逆。
        #
        # restore/build より前に置いて、数分ではなく数秒で落とす。
        run: |
          if ('${{ github.ref }}' -notlike 'refs/heads/release/*') {
            Write-Error "This workflow must run on a 'release/x.y.z' branch. Current ref: '${{ github.ref }}'."
            exit 1
          }
          $propsVersion = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $expectedVersion = '${{ github.ref_name }}' -replace '^release/', ''
          if ($propsVersion -ne $expectedVersion) {
            Write-Error "Directory.Build.props Version='$propsVersion' does not match branch 'release/$expectedVersion'. Update <Version> in Directory.Build.props before pushing."
            exit 1
          }
          Write-Host "Version OK: Directory.Build.props=$propsVersion matches branch release/$expectedVersion"
        shell: pwsh

      - name: Setup .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'release-dotnet'
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest 'https://raw.githubusercontent.com/actions/setup-dotnet/a98b56852c35b8e3190ac28c8c2271da59106c68/externals/install-dotnet.ps1' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne 'B224982626C6DDF7CE915D7D560B7060D3C42754EB621F8CC53B8C775C0CC6B5') { throw 'Pinned .NET installer SHA-256 mismatch.' }
          & $installer -Channel 10.0 -InstallDir $installRoot -NoPath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "DOTNET_ROOT=$installRoot" >> $env:GITHUB_ENV
          $installRoot >> $env:GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore AlphaFS.slnx

      - name: Build Release
        # ContinuousIntegrationBuild: SourceLink が埋め込むパスを決定論的な形に正規化する。
        run: dotnet build AlphaFS.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run unit tests
        # MSTest 4.x は Microsoft.Testing.Platform (MTP) v2 を使う。VSTest 専用の `--logger` は MTP では
        # 不正な引数となり、テストを 1 件も実行しないまま exit 5 で抜けてしまうため指定しない
        # (MTP は既定でコンソールへ結果を出力する)。MTP モードへの切り替えは repo 直下の global.json で行う。
        #
        # ALPHAFS_SKIP_NETWORK_TESTS: runner には SMB 管理共有が無いため、ネットワーク側の検証は
        # Assert.Inconclusive で skip する。ローカル側は先に実行されるのでリグレッションは検知できる。
        #
        # 注意: GitHub runner は管理者権限で動くため、RequireElevation でガードされた検証は
        # skip されず実行される (skip されるのは非昇格環境のみ)。ローカルの非昇格シェルでは通るのに
        # CI では落ちる、という差はこれが原因になり得る。
        #
        # 引数はここに書いた形のまま維持する。MTP はサポートしていない引数を渡されると、
        # テストを 1 件も実行しないまま "Zero tests ran" / exit 5 で抜ける。
        # TRX レポート (--report-trx) はこの構成では使えない
        # (Microsoft.Testing.Extensions.TrxReport の参照が必要)。
        # 失敗したテスト名とスタックトレースはコンソール出力に含まれ、GitHub 側でログが保持される。
        env:
          ALPHAFS_SKIP_NETWORK_TESTS: '1'
        run: dotnet test AlphaFS.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/AlphaFS/AlphaFS.csproj -c Release --no-build -o artifacts

      - name: Authenticate to NuGet.org
        id: login
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:NUGET_USER -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN -or -not $env:ACTIONS_ID_TOKEN_REQUEST_URL) {
            throw 'NuGet user and GitHub OIDC permissions are required.'
          }
          Write-Output "::add-mask::$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          try {
            $url = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$([uri]::EscapeDataString('https://www.nuget.org'))"
            $oidc = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
            if (-not $oidc.value) { throw 'Missing OIDC token.' }
            Write-Output "::add-mask::$($oidc.value)"
            $body = @{ username = $env:NUGET_USER; tokenType = 'ApiKey' } | ConvertTo-Json -Compress
            $result = Invoke-RestMethod -Method Post -Uri 'https://www.nuget.org/api/v2/token' -Headers @{ Authorization = "Bearer $($oidc.value)" } -ContentType 'application/json' -Body $body -StatusCodeVariable nugetStatusCode
            if ($nugetStatusCode -ne 200) { throw 'Unexpected NuGet token exchange status.' }
            if (-not $result.apiKey -or $result.apiKey -match '[\r\n]') { throw 'Missing or invalid NuGet API key.' }
            Write-Output "::add-mask::$($result.apiKey)"
            "NUGET_API_KEY=$($result.apiKey)" >> $env:GITHUB_OUTPUT
          } catch {
            throw 'NuGet Trusted Publishing authentication failed.'
          }

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $version = '${{ github.ref_name }}' -replace '^release/', ''
          $package = "artifacts\1llum1n4t1s.AlphaFS.$version.nupkg"
          if (-not (Test-Path -LiteralPath $package)) {
            Write-Error "Expected package not found: $package"
            exit 1
          }
          dotnet nuget push $package `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
